summary {
  cursor: pointer;
}
section {

label {

}
label span {

output {

p {

  font-size: 12px;
  margin: 8px 0;
}
h1 {

  margin: 12px;
}
input[type="checkbox"] {
  accent-color: #71cfc2;
}

body {

}
button {
  font: inherit;
  background: #243650;
  color: #fff;
  border: 1px solid #53647c;
  border-radius: 4px;
  padding: 5px 10px;
  cursor: pointer;
}
button:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 2px solid #7ae0d0;
  outline-offset: 2px;
}
.bar {
  min-height: 54px;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px;
  flex-wrap: wrap;
}
.bar span {
  flex: 1;
  color: #b9c9dd;
  font-size: 12px;
}
.viewport {
  height: calc(100vh - 110px);
  min-height: 420px;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
  background: #111c2c;
}
.viewport:active {
  cursor: grabbing;
}
.viewport svg {
  display: block;
  width: 100%;
  height: 100%;
}
details {
  padding: 8px 12px;
  border-top: 1px solid #38495f;
}
summary {
  cursor: pointer;
}
section {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 7px 20px;
  padding: 12px 0;
}
label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
}
label span {
  min-width: 78px;
}
input[type="range"] {
  width: 100%;
  min-width: 45px;
  accent-color: #71cfc2;
}
output {
  min-width: 34px;
}
p {
  color: #b9c9dd;
  font-size: 12px;
  margin: 8px 0;
}
h1 {
  font-size: 16px;
  margin: 12px;
}
input[type="checkbox"] {
  accent-color: #71cfc2;
}
body {
  overflow: hidden;
}
.viewport {
  height: calc(100vh - 58px);
  min-height: 0;
}
.bar {
  height: 58px;
  flex-wrap: nowrap;
}
.bar span {
  flex: initial;
}
.bar button {
  white-space: nowrap;
}
.inspector {
  position: absolute;
  top: 58px;
  right: 0;
  padding: 0;
  border: 1px solid #53647c;
  z-index: 10;
  background: #17283bf5;
  width: 270px;
  max-height: calc(100vh - 58px);
  overflow: auto;
}
.inspector summary {
  padding: 10px 14px;
  font-weight: 650;
}
.panel {
  padding: 0 14px 14px;
}
.actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 12px 0;
}
.layer-control {
  border-bottom: 1px solid #3b4b60;
  padding: 10px 0;
}
.layer-control > label {
  font-size: 14px;
}
.slider-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.slider-row input {
  min-width: 0;
  width: 100%;
}
.slider-row button {
  font-size: 12px;
}
.item-controls {
  border-bottom: 1px solid #53647c;
  padding-bottom: 14px;
}
h2 {
  font-size: 14px;
  margin: 12px 0 6px;
}
select {
  font: inherit;
  background: #243650;
  border: 1px solid #53647c;
  color: white;
  padding: 6px;
  border-radius: 4px;
  width: 100%;
}
button:disabled {
  opacity: 0.4;
  cursor: default;
}
.selected-item {
  filter: brightness(1.5);
}
.inspector:not([open]) {
  width: auto;
}
#zoom-level {
  min-width: 38px;
}
section.layer-list {
  display: block;
  padding: 0;
}
